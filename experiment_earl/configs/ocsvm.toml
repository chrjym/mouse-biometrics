# One-Class SVM experiment settings, read by scripts/benchmark_ocsvm.py.
#
# Run:   python experiment_earl/scripts/benchmark_ocsvm.py
#        python experiment_earl/scripts/benchmark_ocsvm.py --config experiment_earl/configs/my_copy.toml
#
# Tip: copy this file for each experiment (e.g. ocsvm_nu01.toml) so you can
# compare runs later. The settings used are saved inside the output JSON.
#
# Lines starting with # are comments. Text values need "quotes";
# lists use [brackets].


[data]
# Folders are relative to experiment_earl/.
train_dir = "datasets/balabit/training_files"  # genuine sessions used to enroll (build the profile)
test_dir  = "datasets/balabit/test_files"      # sessions to check against the profile
labels    = "datasets/balabit/public_labels.csv"  # says which test sessions are impostors (is_illegal = 1)
output    = "outputs/benchmark_ocsvm.json"     # where results are written
users     = []  # e.g. ["user7", "user9"] to test only some users; [] = all users


[enrollment]
sessions = 3      # random training sessions per user (adviser: 3). Balabit has 5-7 per user.
seed     = 0      # changes WHICH sessions are picked; try 0, 1, 2 ... to see how stable the EER is
interval = 1.0    # chunk length in seconds (Earl's idea: 1 second)

# Cap on training chunks per user. The SVM gets slow fast as this grows (roughly
# n^2 to n^3), so a random subsample keeps enrollment cheap. 0 = use every chunk.
max_train_chunks = 0


[features]
# Which per-chunk features the SVM sees. Remove a name to test without it.
# Available (see scripts/features.py):
#   dx, dy             net displacement in the second (Earl's original chunk end point)
#   path_length        total distance travelled inside the second (px)
#   straightness       net distance / path length (1 = straight, near 0 = loop or zig-zag)
#   mean_speed         average speed between events (px/s)
#   max_speed          fastest step (px/s)
#   curvature          total turning / path length (how bendy the path is)
#   total_turning      sum of all turning angles (rad)
#   direction_changes  number of turns sharper than turn_degrees
#   pauses             number of gaps longer than pause_ms (the hand stopped)
use = [
    "dx", "dy",
    "path_length", "straightness",
    "mean_speed", "max_speed",
    "curvature", "total_turning",
    "direction_changes", "pauses",
]

# A gap between two events longer than this counts as a pause.
# Balabit logs every ~16 ms (user7/9/20) or ~110 ms (the others), so keep this
# above ~150 ms or the slower loggers will look like they pause all the time.
pause_ms = 200

# A turn sharper than this between two steps counts as a direction change.
turn_degrees = 45

# Features with a long tail (a few huge values) are squashed with log(1 + |value|),
# keeping the sign, so a few very fast moves don't dominate the SVM.
log_transform = ["path_length", "mean_speed", "max_speed", "total_turning"]

# How features are put on the same scale before the SVM (it is very sensitive to this):
#   "standard" = subtract mean, divide by standard deviation (usual choice)
#   "robust"   = use median and interquartile range (less affected by outliers)
#   "none"     = no scaling (only if you know what you're doing)
scaler = "standard"


[svm]
# The One-Class SVM learns a boundary around the genuine user's chunks.
# Anything outside the boundary is treated as "not this user".

# Shape of the boundary:
#   "rbf"     = smooth blob-shaped regions (usual choice, start here)
#   "linear"  = a single flat cut (usually too simple)
#   "poly"    = polynomial curve, see degree
#   "sigmoid" = rarely useful
kernel = "rbf"

# nu (0 to 1): roughly the share of the GENUINE training chunks allowed to fall
# outside the boundary. Small = loose boundary (accepts more, including impostors);
# large = tight boundary (rejects more, including the genuine user).
# Try 0.01, 0.05, 0.1, 0.2, 0.5.
nu = 0.05

# gamma: how far one training chunk's influence reaches (rbf/poly/sigmoid only).
#   "scale" = automatic, 1 / (number of features * feature variance), good default
#   "auto"  = 1 / number of features
#   or a number, e.g. 0.1 (smooth, wide boundary) ... 10 (tight, wiggly, can overfit)
gamma = "scale"

degree = 3    # only for kernel = "poly": the polynomial degree
coef0  = 0.0  # only for kernel = "poly" or "sigmoid": constant term


[scoring]
# How one test session gets a single score from its many chunks:
#   "accept_rate" = share of chunks the SVM says are inside the boundary
#   "mean_score"  = average signed distance to the boundary (smoother, often better)
session_score = "mean_score"

# Also build Earl's concave hull from (dx, dy) as a baseline to compare against.
compare_hull  = true
concave_ratio = 0.1  # 0 = tightest concave hull, 1 = same as the convex hull
