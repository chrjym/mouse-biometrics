# Every script in src/ and the notebook read this file; nothing is hardcoded there.
# Results go to runs/<hash>/<n_legitimate>_<n_impostor>_<sensitivity>_<sessions_per_user>/; the hash covers every other
# setting, so any change gives a new folder and older results are kept.
# Every setting is explained in CONFIG.md.

# --- Experiment size (main configuration: 01-05, the notebook, 08 and 09) ---
# One RNG draw from `seed` fixes the legitimate users, the impostor users and each user's session order for the whole run.
seed: 945                   # picks the users and sessions once; the same seed gives the same users and sessions
n_legitimate: 1            # users whose shapes form the legitimate profiles
n_impostor: 9              # other users compared against them (n_legitimate + n_impostor <= 10 Balabit users)
sessions_per_user: 44       # sessions per user; the notebook tests 1, 2, ... up to this (max: printed by every script)

# --- Sensitivity sweep (16, 17): left out of the run hash, so the sweep writes into runs/<hash>/sweep/ ---
# The splits are fixed; each [legitimate, impostor] pair is its own draw from `seed`, so only the users are random.
splits:
  - [1, 5]
  - [5, 1]
  - [3, 2]
  - [2, 3]
sweep_sensitivity: [0.01, 1.00, 0.01]  # start, stop, step of the sensitivities scored (each is a cut on the same DTW distances)
sweep_sessions_max: 40      # library sizes 1, 2, ... up to this many of a legitimate user's first sessions
sweep_test_sessions: 40     # tested per user: a legitimate user's last this many sessions, an impostor's first this many

# --- Data: all of Balabit, raw (adviser, 2026-10-08) ---
# training_files and test_files are merged into one folder per user (adviser, 2026-10-14).
# A session belongs to the user whose folder it is in, except Balabit's attack sessions (another person in this
# user's folder): sessions that `labels_file` marks is_illegal=1 are dropped.
dataset_dir: datasets/balabit/users   # relative to experiment_earl/
labels_file: datasets/balabit/public_labels.csv   # null = keep every session (old behaviour)

# --- Chunking (03): cut a session into strokes ---
pause_gap_s: 0.5           # a pause longer than this many seconds starts a new chunk (clicks also split chunks)
min_points: 10             # chunks with fewer recorded points are dropped as jitter
min_length_px: 0           # chunks whose path is shorter than this are dropped (0 = no filter)
resample_n: 64             # every chunk is redrawn with this many evenly spaced points before matching

# --- Matching (04): when do two shapes, a session and a user match ---
dtw_band: 0.1              # DTW may stretch a shape by at most this share of resample_n
sensitivity: 0.02          # (formerly dtw_tolerance) chunks match when their mean DTW distance per point is <= this (lower = stricter; 0.15 matched ~99% of everything)
match_shape_ratio: 0.2     # a session matches a profile when at least this share of its chunks match
match_session_ratio: 0.5   # an impostor user is "matched" when at least this share of their sessions match
