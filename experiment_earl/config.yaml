# EARL shape-matching experiment (Balabit only).
# Every script in src/ and the notebook read this file; nothing is hardcoded there.
# Changing any value (except run_name) creates a new folder under runs/, so older results are kept.
# Every setting is explained in CONFIG.md.

run_name: experiment1       # label for this config's folder under runs/ (a short hash of the settings is appended)

# --- Experiment size (single trial 01-05 and the notebook) ---
seed: 934                   # starting number of every random draw; the same seed gives the same draw
n_legitimate: 3            # users whose shapes form the legitimate profiles
n_impostor: 2              # other users compared against them (n_legitimate + n_impostor <= 10 Balabit users)
sessions_per_user: 5       # sessions per user; the notebook tests 1, 2, ... up to this (max: printed by every script)
n_trials: 20                # random draws each result is averaged over (the notebook and the sweep)

# --- Data: all of Balabit, raw (adviser, 2026-10-08) ---
# A session belongs to the user whose folder it is in. No label file is used.
dataset_dir: datasets/balabit/training_files   # relative to experiment_earl/
test_dir: datasets/balabit/test_files          # relative to experiment_earl/
use_test_files: true       # add each user's test_files sessions after their training sessions

# --- Chunking (03): cut a session into strokes ---
pause_gap_s: 0.5           # a pause longer than this many seconds starts a new chunk (clicks also split chunks)
min_points: 10             # chunks with fewer recorded points are dropped as jitter
min_length_px: 0           # chunks whose path is shorter than this are dropped (0 = no filter)
resample_n: 64             # every chunk is redrawn with this many evenly spaced points before matching

# --- Matching (04): when do two shapes, a session and a user match ---
dtw_band: 0.1              # DTW may stretch a shape by at most this share of resample_n
dtw_tolerance: 0.02        # chunks match when their mean DTW distance per point is <= this (lower = stricter; 0.15 matched ~99% of everything)
match_shape_ratio: 0.3     # a session matches a profile when at least this share of its chunks match
match_session_ratio: 0.5   # an impostor user is "matched" when at least this share of their sessions match

# --- Full sweep (06): every sessions x legitimate x impostor combination that fits in 10 users ---
sweep_sessions_max: 5      # tries 1 up to this many sessions per user (max: printed by every script)
sweep_delta: 0.05          # a step that changes the mean threshold by less than this counts as "flat" (saturated)

# --- Hulls (09): raw data -> chunk end points at (0, 0) -> convex hull -> concave hull, per user ---
concave_ratio: 0.1         # concave hull tightness: 0 = tightest outline, 1 = same as the convex hull

# --- Hull anomaly test (10): training sessions only ---
anomaly_enroll_sessions: 4   # sessions that build a user's concave hull (Balabit users have 5-7 training sessions)
anomaly_window: 30           # strokes per window; each session is checked window by window
anomaly_outside_share: 0.2   # a window is an anomaly when more than this share of its strokes end outside the hull

# --- One-Class SVM anomaly test (11): same sessions, window and enrollment as 10 ---
ocsvm_features: [dx, dy, path_length, straightness, mean_speed, duration]   # per-stroke features; see CONFIG.md
ocsvm_nu: 0.05               # about this share of the user's own training strokes may fall outside the learned region
ocsvm_gamma: scale           # RBF kernel reach: "scale" (automatic), "auto", or a number (larger = tighter, wigglier region)
ocsvm_max_train: 4000        # random training strokes per model (the SVM slows down fast with more); 0 = all
ocsvm_resample_ms: 0         # 0 = raw points; e.g. 125 = path on a 125 ms grid, so ~16 ms and ~110 ms loggers compare fairly
ocsvm_flag_score: 0.0        # a window is an anomaly when its mean SVM score is below this (0 = the learned boundary)

# --- DTW shape-matching anomaly test (12): same sessions, window and enrollment as 10 and 11 ---
dtw_max_library: 4000        # random shapes per user library (same cap as ocsvm_max_train, so all methods see as much data); 0 = all
